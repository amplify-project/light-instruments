[platformio]
src_dir = .
default_envs = seeed_xiao

[env]
lib_extra_dirs = ../common
lib_deps =
  LightInstrument

[env:seeed_xiao]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -D XIAO

[env:lolin32_lite]
platform = espressif32
board = lolin32_lite
framework = arduino
upload_speed = 115200
monitor_speed = 460800
build_flags =
  -D LOLIN
