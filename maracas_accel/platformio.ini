[platformio]
src_dir = .
default_envs = seeed_xiao_mpu6050

[env:seeed_xiao_mma8451]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -D USE_MMA8451
lib_deps =
    adafruit/Adafruit MMA8451 Library @ ^1.2.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:seeed_xiao_mpu6050]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -D USE_MPU6050

[env:lolin32_lite_mpu6050]
platform = espressif32
board = lolin32_lite
framework = arduino
upload_speed = 115200
monitor_speed = 460800
build_flags =
    -D USE_MPU6050
